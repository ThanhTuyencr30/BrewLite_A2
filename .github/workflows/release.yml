name: Release Container Images

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  quality-gate:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  build-and-push:
    name: Build and push versioned images
    needs: quality-gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Normalize image owner
        id: owner
        shell: bash
        run: |
          owner="$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          echo "value=$owner" >> "$GITHUB_OUTPUT"

      - name: Validate production API URL
        env:
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
        run: |
          if [ -z "$NEXT_PUBLIC_API_URL" ]; then
            echo "::error::Set the GitHub Actions variable NEXT_PUBLIC_API_URL before publishing release images."
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.owner.outputs.value }}/brewlite-api:${{ github.sha }}
            ghcr.io/${{ steps.owner.outputs.value }}/brewlite-api:${{ github.ref_name }}

      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }}
          tags: |
            ghcr.io/${{ steps.owner.outputs.value }}/brewlite-web:${{ github.sha }}
            ghcr.io/${{ steps.owner.outputs.value }}/brewlite-web:${{ github.ref_name }}
